name: vestipro
description: "VestiPro force of sales app for B2B fashion."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Multi-idioma (TASK-174): pt/en interface strings, generated from
  # `lib/l10n/app_*.arb` via `generate: true` below.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  collection: ^1.19.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: 10.0.0
  connectivity_plus: ^7.3.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  # Pinned to match `flutter_localizations`' own transitive `intl` constraint
  # (TASK-174) — Flutter SDK's `flutter_localizations` requires exactly
  # 0.20.2, so this can no longer float freely on `^0.20.3`.
  intl: ^0.20.2
  image_picker: ^1.2.3
  file_picker: ^12.0.0
  flutter_image_compress: ^2.5.1
  video_player: ^2.14.0
  photo_view: ^0.15.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  uuid: ^4.6.0
  # Pure-Dart SHA-256 (TASK-180, assinatura eletrônica de pedido): computes the
  # order-content hash `OrderContentHasher` needs — the same well-known,
  # actively maintained dart-lang package already implied by the "no native
  # code, cross-platform" precedent `pdf`/`printing` set (see their own
  # comment below). Never used for anything security-critical on its own —
  # the server (`signOrder` Cloud Function) always recomputes/reverifies this
  # same hash against Firestore's own truth, this package is only what
  # produces it on both sides.
  crypto: ^3.0.6
  # Reserved for external REST integrations (ERP/public API). Firebase access must use FlutterFire SDKs.
  dio: ^5.11.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  cloud_functions: ^6.3.6
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  firebase_performance: ^0.11.4+6
  firebase_messaging: ^16.5.0
  firebase_remote_config: ^6.5.6
  firebase_app_check: ^0.4.6
  bloc_concurrency: ^0.3.0
  # XLSX export (TASK-147): `excel` is a pure-Dart, actively maintained
  # (2024+ releases), cross-platform (mobile/desktop/web, no native code)
  # reader/writer — the only real candidate that doesn't require a
  # commercial license (unlike `syncfusion_flutter_xlsio`). It has no
  # built-in freeze-pane/AutoFilter API, so `XlsxReportEncoder`
  # (`domain/services/xlsx_report_encoder.dart`) post-processes the
  # generated archive's worksheet XML directly for those two features,
  # using `archive` (zip read/write) and `xml` (OOXML element injection) —
  # both already transitive dependencies of `excel`, declared here directly
  # because our own code calls their APIs, not just `excel`'s.
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.6.1
  # PDF export (TASK-148): `pdf` is a pure-Dart, actively maintained,
  # cross-platform (mobile/desktop/web) PDF producer — same "no native code,
  # no commercial license" rationale already applied to `excel` above.
  # `printing` is its companion Flutter plugin, used only by the
  # presentation-layer preview screen (`PdfPreview` widget) so the user can
  # see the generated document and cancel before it is actually saved
  # (`ReportPdfPreviewPage`) — `PdfReportEncoder` itself never imports it.
  pdf: ^3.11.5
  printing: ^5.13.4
  # Mapa de clientes (TASK-176): federated plugin with Android/iOS/Web
  # implementations bundled transitively (`google_maps_flutter_android/_ios/
  # _web`) — no extra per-platform package needed. Requires a real Google
  # Maps API key configured per platform in production (AndroidManifest.xml,
  # AppDelegate.swift/Info.plist, web/index.html) — not available in this
  # environment; see TASK-176 "Riscos conhecidos".
  google_maps_flutter: ^2.18.0
  # Roteirização de visitas (TASK-177): opens the seller's chosen external
  # navigation app (Google Maps/Waze/Apple Maps) with a validated
  # destination — see `NavigationLinkBuilder`. Universal `https://` links
  # only (no custom URL scheme/`<queries>`/`LSApplicationQueriesSchemes`
  # declaration needed), same "no extra native wiring in this environment"
  # precedent already set for `google_maps_flutter` above.
  url_launcher: ^6.3.1
  # Check-in de visita (TASK-178): captura pontual da localização atual do
  # dispositivo, sempre sob consentimento explícito por ação
  # (`VisitCheckInLocationService`/`GeolocatorVisitCheckInLocationService`),
  # nunca em segundo plano. Ao contrário de `google_maps_flutter`/
  # `url_launcher`, este plugin exige permissão nativa de localização
  # (`ACCESS_FINE_LOCATION`/`NSLocationWhenInUseUsageDescription`) — ver
  # "Riscos conhecidos" no relatório desta task para o que ainda precisa de
  # validação em dispositivo real.
  geolocator: ^14.0.3
  # Leitura de código de barras/QR (TASK-216): universal, actively maintained
  # Flutter plugin — CameraX/ML Kit on Android, AVFoundation/Apple Vision on
  # iOS, ZXing on Web — covering exactly this project's three target
  # platforms (android/ios/web; there is no windows/linux/macos folder in
  # this repo). No extra native permission-request package needed: camera
  # permission prompting/denial is handled by the plugin itself and surfaced
  # to Dart as a typed `MobileScannerException`
  # (`BarcodeScannerCameraSurface`). Declaring
  # `NSCameraUsageDescription`/`android.permission.CAMERA` is still required
  # per-platform (done in `ios/Runner/Info.plist`/
  # `android/app/src/main/AndroidManifest.xml`).
  mobile_scanner: ^7.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: 3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0
  injectable_generator: 3.0.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  network_image_mock: ^2.1.1
  firebase_core_platform_interface: ^8.1.0
  flutter_secure_storage_platform_interface: ^2.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # TASK-174: generates `AppLocalizations` from `lib/l10n/app_*.arb`
  # (configured in `l10n.yaml`) on every `flutter pub get`/build.
  generate: true

  # Login screen brand logo (TASK-034). Only the file the login screen
  # actually renders is declared here — the rest of `assets/images/` is
  # unused pre-existing branding material, wired in as later screens need
  # it, to keep the app bundle from shipping unused assets.
  assets:
    - assets/images/logo.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
