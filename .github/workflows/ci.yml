name: CI

# TASK-165: pipeline de CI/CD. Roda em toda PR contra main e em todo push em main, bloqueando merge
# quando qualquer quality gate falhar (formatter, analyzer, testes unitarios/widget, testes de
# integracao contra o Firebase Emulator Suite, auditoria de dependencias ou build por ambiente).
# Reproduzivel localmente pelo mesmo conjunto de comandos documentado em
# docs/architecture/static-quality.md, docs/architecture/testing.md e README.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ---------------------------------------------------------------------------------------------
  # Pilar 1: dart format + flutter analyze + marcadores TODO/FIXME (scripts/check.ps1, ja usado
  # localmente por toda task Dart/Flutter) + testes unitarios/widget com cobertura.
  # ---------------------------------------------------------------------------------------------
  quality:
    name: Flutter quality gate (format, analyze, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Firebase client config
        uses: ./.github/actions/setup-firebase-config
        with:
          firebase-options-dart-base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Static quality gate (dart format + flutter analyze + TODO/FIXME markers)
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Unit and widget tests with coverage
        run: flutter test --coverage

      - name: Generate HTML coverage report
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info -o coverage/html

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-report
          path: |
            coverage/lcov.info
            coverage/html
          retention-days: 30

      - name: Report outdated Dart/Flutter dependencies (informational, non-blocking)
        continue-on-error: true
        run: flutter pub outdated --show-all

  # ---------------------------------------------------------------------------------------------
  # Qualidade estatica do codebase TypeScript das Cloud Functions (lint + type-check). Rapido, sem
  # Emulator/Java -- os testes reais de functions/ (que dependem do Emulator) rodam no job
  # integration-tests, junto com Rules e o client Flutter (mesmo motivo documentado em TASK-162:
  # functions/test mistura teste unitario mockado com teste de integracao real contra o Emulator).
  # ---------------------------------------------------------------------------------------------
  functions-static:
    name: Cloud Functions quality gate (eslint + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: eslint
        run: npm run lint
        working-directory: functions

      - name: Type-check (tsc)
        run: npx tsc --noEmit
        working-directory: functions

  # ---------------------------------------------------------------------------------------------
  # Auditoria de dependencias vulneraveis dos 3 subprojetos Node (functions, firestore-tests,
  # storage-tests). --audit-level=high: vulnerabilidades moderadas sem fix disponivel nas SDKs do
  # Firebase/Google Cloud sao um risco aceito e conhecido do ecossistema (nao um problema introduzido
  # por este repositorio); alta/critica bloqueia o merge. Ver TASK-165-CONCLUIDA e BACKLOG-004 para o
  # estado real desta auditoria no momento em que o pipeline foi criado.
  # ---------------------------------------------------------------------------------------------
  dependency-audit:
    name: Dependency vulnerability audit (Node subprojects)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [functions, firestore-tests, storage-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: npm audit (fails on high/critical)
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.project }}

  # ---------------------------------------------------------------------------------------------
  # Pilar 2: Firebase Emulator Suite (Auth, Firestore, Storage, Functions) via `firebase
  # emulators:exec`, cobrindo Firestore/Storage Security Rules (positivo/negativo/multi-tenant),
  # Cloud Functions criticas (precificacao, numero de pedido, aprovacoes) e os testes de integracao
  # client-side do app Flutter (auth, firestore, storage, functions, variantes de produto) -- TASK-162
  # e TASK-163. Usa o orquestrador unico ja preparado para isso: `npm run test:integration`.
  # ---------------------------------------------------------------------------------------------
  integration-tests:
    name: Integration tests (Firebase Emulator Suite)
    runs-on: ubuntu-latest
    needs: [quality, functions-static]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Firebase client config
        uses: ./.github/actions/setup-firebase-config
        with:
          firebase-options-dart-base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install firestore-tests dependencies
        run: npm ci
        working-directory: firestore-tests

      - name: Install storage-tests dependencies
        run: npm ci
        working-directory: storage-tests

      - name: flutter pub get
        run: flutter pub get

      - name: Run full integration suite against the Emulator Suite
        # Optional: only set if the Firebase CLI ever requires non-interactive auth for project
        # "vestipro" (see TASK-165-CONCLUIDA, "Riscos"). Empty/unset is a no-op.
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npm run test:integration

  # ---------------------------------------------------------------------------------------------
  # Pilar 3: builds por ambiente (dev/staging/prod) como etapa de verificacao -- build quebrado
  # bloqueia merge. Nunca usa credenciais de producao alem da config publica de cliente Firebase
  # (ver setup-firebase-config); signing de release usa o fallback de debug ja documentado em
  # android/app/build.gradle.kts ("Release signing will be configured in the release pipeline
  # task" -- TASK-166), nao introduzido aqui.
  # ---------------------------------------------------------------------------------------------
  build-android:
    name: Build Android (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            target: lib/main_dev.dart
            mode: --debug
          - flavor: staging
            target: lib/main_staging.dart
            mode: --debug
          - flavor: prod
            target: lib/main_prod.dart
            mode: --release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Firebase client config
        uses: ./.github/actions/setup-firebase-config
        with:
          firebase-options-dart-base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build appbundle --flavor ${{ matrix.flavor }}
        run: flutter build appbundle ${{ matrix.mode }} --flavor ${{ matrix.flavor }} -t ${{ matrix.target }}

  build-web:
    name: Build Web (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        environment: [development, staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Firebase client config
        uses: ./.github/actions/setup-firebase-config
        with:
          firebase-options-dart-base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build web --dart-define=ENVIRONMENT=${{ matrix.environment }}
        run: flutter build web -t lib/main_web.dart --dart-define=ENVIRONMENT=${{ matrix.environment }}

  # ---------------------------------------------------------------------------------------------
  # Um unico status check para configurar como "required" na protecao da branch main, agregando
  # todos os quality gates acima -- basta exigir este job, em vez de listar todos manualmente.
  # ---------------------------------------------------------------------------------------------
  all-checks-passed:
    name: All quality gates passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality
      - functions-static
      - dependency-audit
      - integration-tests
      - build-android
      - build-web
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "functions-static=${{ needs.functions-static.result }}"
          echo "dependency-audit=${{ needs.dependency-audit.result }}"
          echo "integration-tests=${{ needs.integration-tests.result }}"
          echo "build-android=${{ needs.build-android.result }}"
          echo "build-web=${{ needs.build-web.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required quality gates failed."
            exit 1
          fi
